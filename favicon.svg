<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metalizado / Cromado 3D -->
    <linearGradient id="chrome3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#b0bec5"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="70%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>

    <!-- Gradiente Neon Ciano & Violeta -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Filtro de Sombra 3D e Brilho Intenso -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00f3ff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Escuro de Alto Contraste com Cantos Arredondados -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#050811" />

  <!-- Círculos de Fundo Neon 3D / Rede Neural -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.3" filter="url(#glowEffect)"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Camada de Sombra / Profundidade 3D Base -->
  <g filter="url(#shadow3D)">
    <!-- O símbolo geométrico principal -->
    <path d="M512 120 L780 820 L660 820 L512 500 L364 820 L244 820 Z" 
          fill="url(#chrome3D)" stroke="url(#neonGlow)" stroke-width="8" stroke-linejoin="round"/>
    
    <path d="M640 400 L780 400 L780 820 L700 820 L700 480 L640 480 Z" 
          fill="url(#chrome3D)" stroke="url(#neonGlow)" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Núcleo Central de I.A. Iluminado em 3D -->
  <g filter="url(#glowEffect)">
    <circle cx="512" cy="530" r="65" fill="url(#neonGlow)" />
    <circle cx="512" cy="530" r="30" fill="#ffffff" />
    <!-- Cruz Radiante -->
    <line x1="512" y1="420" x2="512" y2="640" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="402" y1="530" x2="622" y2="530" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
